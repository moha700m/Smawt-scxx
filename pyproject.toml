[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smaet-rec"
version = "0.1.0"
description = "Local-first Windows desktop screen recorder"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "mss>=9.0,<11"]

[tool.setuptools.packages.find]
where = ["src"]
